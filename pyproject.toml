[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "autonomous-procurement-data-swarm"
version = "0.1.0"
description = "Autonomous multi-agent procurement data engineering and TCO strategist swarm using PydanticAI"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Bernardo Oliva Aquino" }
]
dependencies = [
    "pydantic>=2.0",
    "pydantic-ai-slim>=2.0",
    "typer>=0.12",
    "rich>=13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
procurement-swarm = "src.cli:app"

[tool.setuptools.packages.find]
include = ["src*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
